<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubrica Contatti 3.0</title>
    <!-- Importazione di un font in stile terminale/monospace (Share Tech Mono) -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #2ea043;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --radius: 4px; /* Bordi più squadrati stile computer vintage */
        }

        body {
            /* Cambio totale del font */
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 24px;
            color: #2ea043;
            border-bottom: 2px dashed var(--border-color); /* Bordo tratteggiato */
            padding-bottom: 10px;
            letter-spacing: 2px;
        }

        .form-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 1rem;
            color: var(--accent-color);
        }

        input, select {
            font-family: 'Share Tech Mono', monospace;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 1.1rem;
            outline: none;
            transition: all 0.2s ease;
            background-color: #0d1117;
            color: var(--text-main);
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(46, 160, 67, 0.2);
            background-color: #161b22;
        }

        button {
            font-family: 'Share Tech Mono', monospace;
            grid-column: span 2;
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #3fb950;
        }

        button:active {
            transform: scale(0.98);
        }

        .table-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #1f242c;
            color: #2ea043;
            padding: 16px 20px;
            font-weight: bold;
            font-size: 1rem;
            border-bottom: 2px solid var(--border-color);
            letter-spacing: 1px;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 1.05rem;
            background-color: var(--card-bg);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #1f242c;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">&larr; [ Torna alla Home ]</a>
        
        <h2>RUBRICA CONTATTI</h2>

        <div class="form-container">
            <div class="form-group">
                <label for="inputNome">Nome:</label>
                <input type="text" id="inputNome" placeholder="es. Mario">
            </div>
            <div class="form-group">
                <label for="inputCognome">Cognome:</label>
                <input type="text" id="inputCognome" placeholder="es. Rossi">
            </div>
            <div class="form-group full-width">
                <label for="inputIndirizzo">Indirizzo:</label>
                <input type="text" id="inputIndirizzo" placeholder="es. Via Roma 10">
            </div>
            <div class="form-group">
                <label for="inputCitta">Città:</label>
                <select id="inputCitta">
                    <option value="">-- Seleziona --</option>
                    <option value="Milano">Milano</option>
                    <option value="Roma">Roma</option>
                    <option value="Napoli">Napoli</option>
                    <option value="Torino">Torino</option>
                </select>
            </div>
            <div class="form-group">
                <label for="inputEta">Età:</label>
                <input type="number" id="inputEta" placeholder="es. 25">
            </div>
            <button type="button" onclick="aggiungiElemento()">AGGIUNGI CONTATTO</button>
        </div>

        <h2>ELENCO REGISTRATI</h2>
        <div class="table-container">
            <table id="tabellaAnagrafica">
                <thead>
                    <tr>
                        <th>NOME</th>
                        <th>COGNOME</th>
                        <th>INDIRIZZO</th>
                        <th>CITTA'</th>
                        <th>ETA'</th>
                    </tr>
                </thead>
                <tbody id="corpoTabella">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function aggiungiElemento() {
            let nome = document.getElementById('inputNome').value;
            let cognome = document.getElementById('inputCognome').value;
            let indirizzo = document.getElementById('inputIndirizzo').value;
            let citta = document.getElementById('inputCitta').value;
            let eta = document.getElementById('inputEta').value;

            if (nome === "" || cognome === "" || indirizzo === "" || citta === "" || eta === "") {
                alert("Errore: Tutti i campi devono essere compilati!");
                return;
            }

            let tabellaBody = document.getElementById('corpoTabella');
            let riga = tabellaBody.insertRow(-1);

            riga.insertCell(0).textContent = nome;
            riga.insertCell(1).textContent = cognome;
            riga.insertCell(2).textContent = indirizzo;
            riga.insertCell(3).textContent = citta;
            riga.insertCell(4).textContent = eta;

            // Pulisce i campi dopo l'inserimento
            document.getElementById('inputNome').value = "";
            document.getElementById('inputCognome').value = "";
            document.getElementById('inputIndirizzo').value = "";
            document.getElementById('inputCitta').value = "";
            document.getElementById('inputEta').value = "";
        }
    </script>

</body>
</html>
