<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcolatrice 1.0</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 22px;
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    .input-group, .result-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      color: #888888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 12px;
      background-color: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #ffffff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus, input[type="text"]:focus {
      border-color: #e50914;
    }

    #result {
      background-color: #121212;
      border-color: #2a2a2a;
      font-size: 22px;
      font-weight: 600;
      text-align: right;
    }

    .buttons-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      background-color: #2a2a2a;
      color: #ffffff;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 14px 0;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    button:hover {
      background-color: #e50914;
      border-color: #e50914;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Calcolatrice 1.0</h1>
    
    <div class="grid">
      <div class="input-group">
        <label for="num1">Primo numero</label>
        <input type="number" id="num1">
      </div>
      <div class="input-group">
        <label for="num2">Secondo numero</label>
        <input type="number" id="num2">
      </div>
    </div>

    <div class="buttons-row">
      <button onclick="calcola('+')">+</button>
      <button onclick="calcola('-')">-</button>
      <button onclick="calcola('*')">*</button>
      <button onclick="calcola('/')">/</button>
    </div>

    <div class="result-group">
      <label for="result">Risultato</label>
      <input type="text" id="result">
    </div>
  </div>

  <script>
    function calcola(op) {
      const num1 = parseFloat(document.getElementById('num1').value);
      const num2 = parseFloat(document.getElementById('num2').value);
      const risultato = document.getElementById('result');

      switch (op) {
        case '+':
          risultato.value = num1 + num2;
          break;
        case '-':
          risultato.value = num1 - num2;
          break;
        case '*':
          risultato.value = num1 * num2;
          break;
        case '/':
          if (num2 == 0) {
            risultato.value = "Impossibile";
          } else {
            risultato.value = num1 / num2;
          }
          break;
      }
    }
  </script>

</body>
</html>
