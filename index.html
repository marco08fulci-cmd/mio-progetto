
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ Marco's World ✨</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #061b10, #064e2b, #0b2418);
      color: white;
    }

    .cerchio {
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: #00ff8060;
      filter: blur(100px);
      animation: fluttua 6s ease-in-out infinite alternate;
    }

    .cerchio.uno {
      top: -100px;
      left: -100px;
    }

    .cerchio.due {
      bottom: -130px;
      right: -70px;
      background: #42ffb060;
      animation-delay: -3s;
    }

    .card {
      position: relative;
      width: min(90%, 750px);
      padding: 65px 30px;
      text-align: center;
      border: 1px solid #ffffff30;
      border-radius: 35px;
      background: #ffffff0d;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px #00000050;
      animation: entra 1s ease-out;
    }

    .badge {
      display: inline-block;
      padding: 9px 18px;
      border: 1px solid #50ff9b60;
      border-radius: 50px;
      color: #8dffba;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(42px, 9vw, 88px);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -3px;
      margin-bottom: 20px;
    }

    h1 span {
      display: block;
      background: linear-gradient(90deg, #51ff9a, #b5ffd1, #00d875);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 20px #00ff6640);
    }

    p {
      color: #c7e5d2;
      font-size: 17px;
      line-height: 1.8;
    }

    .bottone {
      display: inline-block;
      margin-top: 35px;
      padding: 16px 32px;
      border-radius: 50px;
      background: linear-gradient(90deg, #00d875, #72ffab);
      color: #052815;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 8px 30px #00ff6650;
      transition: transform .3s, box-shadow .3s;
      cursor: pointer;
      border: none;
      font-size: 16px;
      font-family: inherit;
    }

    .bottone:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 12px 40px #00ff6680;
    }

    .firma {
      margin-top: 35px;
      font-size: 12px;
      color: #82aa91;
      letter-spacing: 2px;
    }

    @keyframes entra {
      from {
        opacity: 0;
        transform: translateY(30px) scale(.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fluttua {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(50px, 40px) scale(1.2); }
    }

    @media (max-width: 480px) {
      .card { padding: 50px 20px; }
      h1 { letter-spacing: -2px; }
    }
  </style>
</head>

<body>
  <div class="cerchio uno"></div>
  <div class="cerchio due"></div>

  <main class="card">
    <div class="badge">✦ BENVENUTO NEL MIO MONDO ✦</div>

    <h1>
      CIAO, SONO
      <span>MARCO 💚</span>
    </h1>

    <p>
      Questa è la mia pagina personale.<br>
      Energia positiva, grandi sogni e tanto verde! 🌿
    </p>

    <button class="bottone" onclick="saluta()">
      ✨ Clicca qui
    </button>

    <div class="firma">FATTO CON 💚 DA MARCO</div>
  </main>

  <script>
    function saluta() {
      alert("EHI! 👋 Ciao, benvenuto nel mondo di Marco! 💚");
    }
  </script>
</body>
</html>
