<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            box-sizing: border-box;
        }
        html {
            background-color: #050811;
            background-image: radial-gradient(#0f1c3f 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: "Consolas", "Courier New", monospace;
        }
        body {
            background-color: #0a1020;
            border: 2px solid #0ea5e9;
            border-radius: 18px;
            padding: 28px 40px;
            width: 100%;
            max-width: 780px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(14, 165, 233, 0.15);
            color: #e0f2fe;
            margin: 0;
        }
        h1 {
            font-family: "Courier New", Courier, monospace;
            font-size: 24px;
            font-weight: bold;
            text-align: left;
            margin: 0 0 6px 0;
            color: #38bdf8;
            border-bottom: 2px solid #0284c7;
            padding-bottom: 8px;
        }
        h4 {
            font-size: 13px;
            font-weight: normal;
            text-align: left;
            margin: 10px 0 20px 0;
            color: #7dd3fc;
            line-height: 1.4;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 12px;
            background-color: #050811;
            border: 2px solid #0369a1;
            border-radius: 10px;
            color: #38bdf8;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder {
            color: #1e4e6e;
        }
        input:focus {
            border-color: #38bdf8;
            background-color: #070d1c;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 4px;
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            border: 2px solid #38bdf8;
            border-radius: 10px;
            color: #050811;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.35);
            transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
        }
        button:hover {
            filter: brightness(1.12);
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(1px);
        }
        p {
            margin: 20px 0 6px 0;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #38bdf8;
        }
        #boxOutputChiaro {
            margin: 0 0 18px 0;
            padding: 14px 16px;
            min-height: 48px;
            background-color: #050811;
            border: 2px solid #0ea5e9;
            border-radius: 10px;
            font-family: "Lucida Console", Monaco, monospace;
            font-size: 16px;
            text-transform: none;
            letter-spacing: 1px;
            color: #7dd3fc;
            word-break: break-all;
        }
        a {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 8px;
            padding: 11px;
            background-color: #070d1c;
            border: 2px solid #0369a1;
            border-radius: 10px;
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: background-color 0.2s, color 0.2s;
        }
        a:hover {
            background-color: #0c4a6e;
            color: #e0f2fe;
        }
    </style>
    <script>
        function decodificaTesto() {
            var fraseNascosta = document.getElementById("campoTestoCifrato").value;
            var valoreRitorno = parseFloat(document.getElementById("campoChiaveDecifra").value);
            var totaleLettere = fraseNascosta.length;
            var stringaDecodificata = "";
            for (let contatore = 0; contatore < fraseNascosta.length; contatore++) {
                var carattereEstratto = String.fromCharCode(fraseNascosta.charCodeAt(contatore) - valoreRitorno);
                stringaDecodificata = stringaDecodificata + carattereEstratto;
            }
            document.getElementById("boxOutputChiaro").innerHTML = stringaDecodificata;
        }
    </script>
</head>
<body>
    <h1>Decodificatore di Messaggi</h1>
    <h4>Incolla la frase codificata e inserisci la chiave per leggerla</h4>
    <input type="text" id="campoTestoCifrato" placeholder="Incolla qui il testo nascosto...">
    <input type="number" id="campoChiaveDecifra" placeholder="Inserisci la chiave usata...">
    <button onclick="decodificaTesto()">Decodifica ora</button>
    <p>Testo recuperato:</p>
    <p id="boxOutputChiaro"></p>
    <a href="https://samuriva09-commits.github.io/scuola/cifrario-di-cesare/cripare.html">Torna al codificatore</a>
</body>
</html>
