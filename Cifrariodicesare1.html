<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            box-sizing: border-box;
        }
        html {
            background-color: #050a07;
            background-image: radial-gradient(#0f291a 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: "Consolas", "Courier New", monospace;
        }
        body {
            background-color: #0b140f;
            border: 2px solid #22c55e;
            border-radius: 0px;
            padding: 24px 40px;
            width: 100%;
            max-width: 780px;
            box-shadow: 10px 10px 0px #14532d;
            color: #bbf7d0;
            margin: 0;
        }
        h1 {
            font-family: "Courier New", Courier, monospace;
            font-size: 24px;
            font-weight: bold;
            text-align: left;
            margin: 0 0 6px 0;
            color: #4ade80;
            border-bottom: 2px solid #16a34a;
            padding-bottom: 6px;
        }
        h4 {
            font-size: 13px;
            font-weight: normal;
            text-align: left;
            margin: 8px 0 18px 0;
            color: #86efac;
            line-height: 1.4;
        }
        input {
            width: 100%;
            padding: 11px 14px;
            margin-bottom: 10px;
            background-color: #050a07;
            border: 2px solid #15803d;
            border-radius: 0px;
            color: #4ade80;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }
        input::placeholder {
            color: #2e6f40;
        }
        input:focus {
            border-color: #4ade80;
            background-color: #08120c;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 4px;
            background-color: #16a34a;
            border: 2px solid #4ade80;
            border-radius: 0px;
            color: #050a07;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 4px 4px 0px #052e16;
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s;
        }
        button:hover {
            background-color: #22c55e;
        }
        button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #052e16;
        }
        p {
            margin: 18px 0 6px 0;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4ade80;
        }
        #boxOutputCifrato {
            margin: 0 0 16px 0;
            padding: 12px 14px;
            min-height: 44px;
            background-color: #050a07;
            border: 2px solid #22c55e;
            border-radius: 0px;
            font-family: "Lucida Console", Monaco, monospace;
            font-size: 16px;
            text-transform: none;
            letter-spacing: 1px;
            color: #86efac;
            word-break: break-all;
        }
        a {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 8px;
            padding: 10px;
            background-color: #08120c;
            border: 2px solid #15803d;
            border-radius: 0px;
            color: #4ade80;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: background-color 0.2s, color 0.2s;
        }
        a:hover {
            background-color: #14532d;
            color: #bbf7d0;
        }
    </style>
    <script>
        function codificaTesto() {
            var fraseInserita = document.getElementById("campoTestoChiaro").value;
            var numeroScarto = parseFloat(document.getElementById("campoChiave").value);
            var lunghezzaFrase = fraseInserita.length;
            var stringaCodificata = "";
            for (let indice = 0; indice < fraseInserita.length; indice++) {
                var singoloCarattere = String.fromCharCode(fraseInserita.charCodeAt(indice) + numeroScarto);
                stringaCodificata = stringaCodificata + singoloCarattere;
            }
            document.getElementById("boxOutputCifrato").innerHTML = stringaCodificata;
        }
    </script>
</head>
<body>
    <h1>Codificatore di Messaggi</h1>
    <h4>Scrivi una frase e scegli la chiave numerica per nasconderla</h4>
    <input type="text" id="campoTestoChiaro" placeholder="Scrivi qui la frase in chiaro...">
    <input type="number" id="campoChiave" placeholder="Inserisci la chiave numerica...">
    <button onclick="codificaTesto()">Codifica ora</button>
    <p>Risultato codificato:</p>
    <p id="boxOutputCifrato"></p>
    <a href="https://samuriva09-commits.github.io/scuola/cifrario-di-cesare/decripta.html">Passa al decodificatore</a>
</body>
</html>
