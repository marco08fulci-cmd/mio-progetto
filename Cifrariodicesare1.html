<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            box-sizing: border-box;
        }
        html {
            background-color: #050811;
            background-image: radial-gradient(#0f1c3f 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: "Consolas", "Courier New", monospace;
        }
        body {
            background-color: #0a1020;
            border: 2px solid #3b82f6;
            border-radius: 18px;
            padding: 28px 40px;
            width: 100%;
            max-width: 780px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(59, 130, 246, 0.15);
            color: #dbeafe;
            margin: 0;
        }
        h1 {
            font-family: "Courier New", Courier, monospace;
            font-size: 24px;
            font-weight: bold;
            text-align: left;
            margin: 0 0 6px 0;
            color: #60a5fa;
            border-bottom: 2px solid #2563eb;
            padding-bottom: 8px;
        }
        h4 {
            font-size: 13px;
            font-weight: normal;
            text-align: left;
            margin: 10px 0 20px 0;
            color: #93c5fd;
            line-height: 1.4;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 12px;
            background-color: #050811;
            border: 2px solid #1d4ed8;
            border-radius: 10px;
            color: #60a5fa;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder {
            color: #2b4c8c;
        }
        input:focus {
            border-color: #60a5fa;
            background-color: #070d1c;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 4px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            border: 2px solid #60a5fa;
            border-radius: 10px;
            color: #050811;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.35);
            transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
        }
        button:hover {
            filter: brightness(1.12);
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(1px);
        }
        p {
            margin: 20px 0 6px 0;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #60a5fa;
        }
        #boxOutputCifrato {
            margin: 0 0 18px 0;
            padding: 14px 16px;
            min-height: 48px;
            background-color: #050811;
            border: 2px solid #3b82f6;
            border-radius: 10px;
            font-family: "Lucida Console", Monaco, monospace;
            font-size: 16px;
            text-transform: none;
            letter-spacing: 1px;
            color: #93c5fd;
            word-break: break-all;
        }
        a {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 8px;
            padding: 11px;
            background-color: #070d1c;
            border: 2px solid #1d4ed8;
            border-radius: 10px;
            color: #60a5fa;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: background-color 0.2s, color 0.2s;
        }
        a:hover {
            background-color: #1e3a8a;
            color: #dbeafe;
        }
    </style>
    <script>
        function codificaTesto() {
            var fraseInserita = document.getElementById("campoTestoChiaro").value;
            var numeroScarto = parseFloat(document.getElementById("campoChiave").value);
            var lunghezzaFrase = fraseInserita.length;
            var stringaCodificata = "";
            for (let indice = 0; indice < fraseInserita.length; indice++) {
                var singoloCarattere = String.fromCharCode(fraseInserita.charCodeAt(indice) + numeroScarto);
                stringaCodificata = stringaCodificata + singoloCarattere;
            }
            document.getElementById("boxOutputCifrato").innerHTML = stringaCodificata;
        }
    </script>
</head>
<body>
    <h1>Codificatore di Messaggi</h1>
    <h4>Scrivi una frase e scegli la chiave numerica per nasconderla</h4>
    <input type="text" id="campoTestoChiaro" placeholder="Scrivi qui la frase in chiaro...">
    <input type="number" id="campoChiave" placeholder="Inserisci la chiave numerica...">
    <button onclick="codificaTesto()">Codifica ora</button>
    <p>Risultato codificato:</p>
    <p id="boxOutputCifrato"></p>
    <a href="https://samuriva09-commits.github.io/scuola/cifrario-di-cesare/decripta.html">Passa al decodificatore</a>
</body>
</html>
