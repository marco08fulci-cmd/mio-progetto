<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            box-sizing: border-box;
        }
        html {
            background-color: #f4efe6;
            background-image: radial-gradient(#d6cbb9 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Verdana, Geneva, sans-serif;
        }
        body {
            background-color: #fffdf9;
            border: 2px solid #2c2520;
            border-radius: 6px;
            padding: 36px 30px;
            width: 100%;
            max-width: 440px;
            box-shadow: 8px 8px 0px #2c2520;
            color: #2c2520;
            margin: 0;
        }
        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 26px;
            font-weight: bold;
            text-align: left;
            margin: 0 0 6px 0;
            color: #1c1714;
            border-bottom: 2px solid #d97706;
            padding-bottom: 8px;
        }
        h4 {
            font-size: 13px;
            font-weight: normal;
            text-align: left;
            margin: 10px 0 24px 0;
            color: #5c5046;
            line-height: 1.5;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 14px;
            background-color: #f9f6f0;
            border: 2px solid #cbbba8;
            border-radius: 4px;
            color: #2c2520;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }
        input::placeholder {
            color: #8c7d70;
        }
        input:focus {
            border-color: #d97706;
            background-color: #ffffff;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 4px;
            background-color: #d97706;
            border: 2px solid #2c2520;
            border-radius: 4px;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 3px 3px 0px #2c2520;
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s;
        }
        button:hover {
            background-color: #b45309;
        }
        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #2c2520;
        }
        p {
            margin: 24px 0 6px 0;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6b5e53;
        }
        #boxOutputCifrato {
            margin: 0 0 22px 0;
            padding: 14px;
            min-height: 50px;
            background-color: #fef3c7;
            border: 2px dashed #d97706;
            border-radius: 4px;
            font-family: "Lucida Console", Monaco, monospace;
            font-size: 16px;
            text-transform: none;
            letter-spacing: 1px;
            color: #78350f;
            word-break: break-all;
        }
        a {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 10px;
            padding: 11px;
            background-color: #efe9df;
            border: 1px solid #cbbba8;
            border-radius: 4px;
            color: #2c2520;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        a:hover {
            background-color: #e2d8c8;
        }
    </style>
    <script>
        function codificaTesto() {
            var fraseInserita = document.getElementById("campoTestoChiaro").value;
            var numeroScarto = parseFloat(document.getElementById("campoChiave").value);
            var lunghezzaFrase = fraseInserita.length;
            var stringaCodificata = "";
            for (let indice = 0; indice < fraseInserita.length; indice++) {
                var singoloCarattere = String.fromCharCode(fraseInserita.charCodeAt(indice) + numeroScarto);
                stringaCodificata = stringaCodificata + singoloCarattere;
            }
            document.getElementById("boxOutputCifrato").innerHTML = stringaCodificata;
        }
    </script>
</head>
<body>
    <h1>Criptare la parola</h1>
    <h4>Inserisci il testo e il numero con cui criptare la parola</h4>
    <input type="text" id="campoTestoChiaro" placeholder="Testo da criptare...">
    <input type="number" id="campoChiave" placeholder="Valore di spostamento...">
    <button onclick="codificaTesto()">Cripta</button>
    <p>messaggio criptato:</p>
    <p id="boxOutputCifrato"></p>
    <a href="https://samuriva09-commits.github.io/scuola/cifrario-di-cesare/decripta.html">Decripta la parola</a>
</body>
</html>
